<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}

button{font:inherit;color:inherit}

header{display:flex;gap:10px;min-width:0;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:20}

.rh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 8px 4px}
.res{all:unset;box-sizing:border-box;display:flex;gap:8px;align-items:baseline;width:100%;padding:7px 8px;border-radius:8px;cursor:pointer}

.sug{display:flex;flex-wrap:wrap;gap:6px;padding:8px}

.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.hmeta{color:var(--muted);font-size:12px;margin-left:auto;text-align:right;white-space:nowrap}
.ibtn{all:unset;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}

main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;min-width:0}
#boardWrap{display:flex;flex-direction:column;position:relative;min-width:0;min-height:0;overflow:hidden}
#fichas{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
#netView{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--bg)}
.v-red #fichas{display:none}
.v-fichas #netView{display:none}
.v-red.nosel .legend{display:none}
#net{display:block;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#net.pointing{cursor:pointer}
#net.grabbing{cursor:grabbing}
#netTip{position:absolute;z-index:6;pointer-events:none;max-width:280px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);box-shadow:var(--shadow);font-size:12px;line-height:1.45}

.lgh{all:unset;cursor:pointer;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 2px 3px;display:flex;justify-content:space-between}
.lgd{all:unset;cursor:pointer;display:flex;gap:7px;align-items:center;padding:2px 2px}
.lgd i{width:9px;height:9px;border-radius:50%;flex:none}
.lgd em{font-style:normal;color:var(--muted);margin-left:auto;padding-left:10px}
.lgd.off{opacity:.35}
#netZoom{position:absolute;right:10px;bottom:10px;z-index:4;display:flex;flex-direction:column;gap:6px}
#netZoom button{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:18px;line-height:1}

.netctl{display:inline-flex;gap:8px;align-items:center}
#toolbar{flex:none;z-index:12;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12.5px}
#toolbar .grow{flex:1}
.legend{display:flex;gap:12px;align-items:center;color:var(--muted)}
.lg{display:inline-flex;gap:5px;align-items:center}
.lg i{display:inline-block;width:18px;height:0;border-top:3px solid var(--ind);border-radius:2px}
.lg.u i{border-color:var(--uses)} .lg.b i{border-color:var(--usedby)} .lg.a i{border-color:var(--both)}
.lg.p i{width:9px;height:9px;border:0;border-radius:50%;background:var(--pend)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:12.5px}
.seg button.on{background:var(--text);color:var(--bg)}
#board{position:relative;padding:14px 14px 40px}
#wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:6}
.band{margin-bottom:18px}
.band-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:0 2px 8px}
.bt{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.bs{color:var(--muted);font-size:12.5px}
.bc{color:var(--muted);font-size:12px;margin-left:auto}
.groups{display:flex;flex-wrap:wrap;gap:10px}
.group{flex:1 1 var(--basis,300px);min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 8px 10px}

.group-head b{font-size:13px}
.group-head code{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.group-head i{font-style:normal;margin-left:auto;color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:6px}
.tile{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-height:46px;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer;transition:opacity .15s}
.tile:hover{border-color:var(--muted)}
.tn{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.tm{color:var(--muted);font-size:10.5px}
.pdot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--pend)}
#board.has-sel .tile{opacity:.3}
#board.has-sel .tile.sel,#board.has-sel .tile.rel{opacity:1}
.tile.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--text)}
.tile.r-out{border-color:var(--uses);box-shadow:0 0 0 1.5px var(--uses)}
.tile.r-in{border-color:var(--usedby);box-shadow:0 0 0 1.5px var(--usedby)}
.tile.r-both{border-color:var(--both);box-shadow:0 0 0 1.5px var(--both)}
.tile.r-ind{border-style:dashed;border-color:var(--ind)}
#board.has-sel .tile.r-ind{opacity:.75}
.hide{display:none!important}
#focusView{display:grid;grid-template-columns:repeat(var(--ncols,3),minmax(168px,1fr));column-gap:68px;align-items:start;min-width:calc(var(--ncols,3)*168px + (var(--ncols,3) - 1)*68px)}
.dcol{display:flex;flex-direction:column;gap:6px;min-width:0}

.dcard .dm{color:var(--muted);font-size:12px;overflow-wrap:anywhere;margin-top:2px}
.dmore{margin-top:6px;align-self:flex-start}
.dtile .tm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.w{fill:none;stroke-linecap:round}
.w-out{stroke:var(--uses)} .w-in{stroke:var(--usedby)} .w-both{stroke:var(--both)} .w-ind{stroke:var(--ind);stroke-dasharray:4 4}
.wn{fill:var(--surface);stroke-width:1.5}
.wt{font:600 10px ui-monospace,Menlo,monospace;fill:var(--text);text-anchor:middle;dominant-baseline:central}
#panel{border-left:1px solid var(--line);overflow:auto;background:var(--surface);-webkit-overflow-scrolling:touch}
.ptabs{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.ptabs .grow{flex:1}
#closeSheet{display:none}
.pbody{padding:14px 16px 40px}
.pbody h2{font-size:17px;line-height:1.3;margin:0 0 4px;overflow-wrap:anywhere}
.pbody h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:11.5px;color:var(--muted);margin-right:4px}
.tag.pk{color:var(--pend);border-color:var(--pend)}
.path{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.lead{margin:10px 0;font-size:14.5px;line-height:1.6}
.lead b{font-weight:650}
details.sec{border-top:1px solid var(--line);padding:6px 0}
details.sec>summary{cursor:pointer;font-weight:600;padding:4px 0;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";display:inline-block;width:14px;color:var(--muted)}
details.sec[open]>summary::before{content:"▾"}
details.sec>summary em{font-style:normal;color:var(--muted);font-weight:400;margin-left:6px}
.fg{margin:6px 0 10px}
.fl,.il,.link{all:unset;cursor:pointer;color:var(--focus)}
.fl{font-weight:600;font-size:13px;overflow-wrap:anywhere}

.fg ul,.plain{list-style:none;margin:2px 0 0 10px;padding:0 0 0 10px;border-left:2px solid var(--line)}
.fg li,.plain li{padding:1px 0;font-size:13px}
.rel{color:var(--muted);font-size:11.5px;margin-right:6px}
.more{color:var(--muted);font-size:12px;margin-left:10px}
.cards{display:flex;flex-direction:column;gap:8px}

.ck{display:inline-block;width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px;margin-right:7px;vertical-align:-2px;position:relative}
.done .ck{background:var(--usedby);border-color:var(--usedby)}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.empty{color:var(--muted);font-style:italic;padding:12px 0}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

function relate(){
  var selFiles=new Set(),rel=new Map(),ind=new Map();
  function add(f,dir,n,name){
    if(f<0||selFiles.has(f))return;
    var r=rel.get(f);if(!r){r={out:0,inn:0,names:[]};rel.set(f,r)}
    if(dir==="out")r.out+=n;else r.inn+=n;
    if(name&&r.names.indexOf(name)<0)r.names.push(name);
  }
  if(sel.t==="node"){
    var n=N[sel.id];if(n.f>=0)selFiles.add(n.f);
    outE[sel.id].forEach(function(e){add(N[e[0]].f,"out",1,N[e[0]].l)});
    inE[sel.id].forEach(function(e){add(N[e[0]].f,"inn",1,N[e[0]].l)});
  }else if(sel.t==="file"){
    selFiles.add(sel.id);
    fOut[sel.id].forEach(function(c,g){add(g,"out",c)});
    fIn[sel.id].forEach(function(c,g){add(g,"inn",c)});
  }else if(sel.t==="group"){
    filesOfGroup[sel.id].forEach(function(f){selFiles.add(f)});
    selFiles.forEach(function(f){
      fOut[f].forEach(function(c,g){add(g,"out",c)});
      fIn[f].forEach(function(c,g){add(g,"inn",c)});
    });
  }else if(sel.t==="pend"){
    P[sel.id].fi.forEach(function(f){selFiles.add(f)});
  }
  if(depth>=2&&sel.t!=="pend"){
    rel.forEach(function(r,f){
      fOut[f].forEach(function(c,g){if(!selFiles.has(g)&&!rel.has(g)&&!ind.has(g))ind.set(g,1)});
      fIn[f].forEach(function(c,g){if(!selFiles.has(g)&&!rel.has(g)&&!ind.has(g))ind.set(g,1)});
    });
  }
  return {selFiles:selFiles,rel:rel,ind:ind};
}

  function rect(el){var r=el.getBoundingClientRect();return {x:r.left-bb.left,y:r.top-bb.top,w:r.width,h:r.height}}
  var C=rect(c),portR={x:C.x+C.w,y:C.y+C.h/2},portL={x:C.x,y:C.y+C.h/2};
  var list=[];

function cpl(a,b){var i=0,m=Math.min(a.length,b.length);while(i<m&&a[i]===b[i])i++;return i}
function mt(q,t,wE,wS,wF){
  if(t===q.s)return wE;
  if(q.alts.has(t))return wS;
  var m=Math.min(t.length,q.s.length);
  if(m>=4&&(t.indexOf(q.s)===0||q.s.indexOf(t)===0))return wF;
  var p=cpl(t,q.s);
  if(p>=5&&p>=Math.ceil(0.6*m))return wF*0.8;
  return 0;
}
function key(s){return fold(s).replace(/[^a-z0-9]+/g,"")}
function search(text){
  var qs=toks(text).filter(function(w){return !STOP.has(w)}).map(function(w){return {s:w,alts:expand(w)}});
  if(!qs.length)return [];
  var full=fold(text.trim()),res=[];
  IDX.forEach(function(e){
    var tot=0,hit=0;
    qs.forEach(function(q){
      var best=0;
      e.lab.forEach(function(t){var v=mt(q,t,3,1.6,1.5);if(v>best)best=v});
      e.pth.forEach(function(t){var v=mt(q,t,1.4,.8,.7);if(v>best)best=v});
      if(best>0){hit++;tot+=best}
    });
    if(!hit)return;
    var s=tot*(hit===qs.length?1.6:1)+hit/qs.length+e.w+0.25*Math.log2(1+e.deg);
    if(key(e.txt)===key(text))s+=6;
    res.push({e:e,s:s,full:hit===qs.length});

  res.sort(function(a,b){return b.s-a.s});
  return res;
}

  /* ----- disposición "Capas": racimos por carpeta dentro de cada capa ----- */
  function pack(items){

      if(!placed.length){placed.push({id:it.id,x:0,y:0,r:it.r});return}
      var step=Math.max(1.5,it.r*0.22),found=null,a0=idx*2.399963;

        for(var k=0;k<na;k++){
          var th=a0+k*6.2832/na,x=rr*Math.cos(th),y=rr*Math.sin(th),ok=true;
          for(var j=0;j<placed.length;j++){

  var discCache={};

  function arrange(data,ROWW){

  /* ----- disposición "Libre": fuerzas, partiendo de las capas ----- */
  function simStep(x,y,S,yT,pin){

    S.alpha+=(S.target-S.alpha)*0.0228;
    var a=S.alpha,gn=G.length,cx=new Float64Array(gn),cy=new Float64Array(gn),cn=new Int32Array(gn);
    for(i=0;i<nF;i++){var g=F[i].g;cx[g]+=x[i];cy[g]+=y[i];cn[g]++}
    for(var q=0;q<LK.length;q++){
      var l=LK[q],A=l.a,B=l.b;
      var dx=x[B]+vx[B]-x[A]-vx[A],dy=y[B]+vy[B]-y[A]-vy[A],d=Math.sqrt(dx*dx+dy*dy)||1e-6;
      var k=(d-(40+rr[A]+rr[B]))/d*a/Math.min(fdeg[A],fdeg[B]),bias=fdeg[A]/(fdeg[A]+fdeg[B]);
      dx*=k;dy*=k;

    }

      var m=rr[i]+rr[j];

    }

      var g2=F[i].g;
      vx[i]+=(cx[g2]/cn[g2]-x[i])*0.11*a;
      vy[i]+=(cy[g2]/cn[g2]-y[i])*0.11*a+(yT[layerOf[i]]-y[i])*0.075*a;
    }
    var mx=0,my=0;
    for(i=0;i<nF;i++){vx[i]*=0.6;vy[i]*=0.6;x[i]+=vx[i];y[i]+=vy[i];mx+=x[i];my+=y[i]}
    mx/=nF;my/=nF;
    for(i=0;i<nF;i++){x[i]-=mx;y[i]-=my}

  /* ----- relaciones para resaltar ----- */

var q=$("#q"),timer=null;
q.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(function(){showResults(q.value)},90)});
q.addEventListener("focus",function(){showResults(q.value)});
q.addEventListener("keydown",function(ev){
  var btns=$$("#results .res");
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){
    ev.preventDefault();if(!btns.length)return;
    cursor=(cursor+(ev.key==="ArrowDown"?1:-1)+btns.length)%btns.length;
    btns.forEach(function(b,i){b.classList.toggle("on",i===cursor)});
    btns[cursor].scrollIntoView({block:"nearest"});
  }else if(ev.key==="Enter"){
    var b=btns[Math.max(cursor,0)];if(b){pick(b.dataset.rt,b.dataset.rid);q.blur()}
  }else if(ev.key==="Escape"){$("#results").classList.remove("on");Net.setMatches(null);q.blur()}
});
document.addEventListener("click",function(ev){
  var t=ev.target;
  if(!t.closest(".search"))$("#results").classList.remove("on");
  var b=t.closest("[data-rt]");if(b){pick(b.dataset.rt,b.dataset.rid);return}
  b=t.closest("[data-view]");if(b){setView(b.dataset.view);return}
  b=t.closest("[data-layout]");if(b){Net.setMode(b.dataset.layout);return}
  b=t.closest("#symBtn");if(b){Net.toggleSyms();return}
  b=t.closest("#edgeBtn");if(b){Net.toggleEdges();return}
  b=t.closest("#lblBtn");if(b){Net.cycleLabels();return}
  b=t.closest("[data-lgtoggle]");if(b){Net.toggleLegend();return}
  b=t.closest("[data-ly]");if(b){Net.toggleLayer(+b.dataset.ly);return}
  b=t.closest("[data-zoom]");if(b){Net.zoom(b.dataset.zoom);return}
  b=t.closest("[data-search]");if(b){q.value=b.dataset.search;showResults(q.value);var f=search(q.value)[0];if(f&&b.closest("#panel")){pick(f.e.t,f.e.id)}return}
  b=t.closest(".tile");if(b){choose({t:"file",id:+b.dataset.f});return}
  b=t.closest(".group-head");if(b){choose({t:"group",id:+b.dataset.g});return}
  b=t.closest("[data-node]");if(b){choose({t:"node",id:+b.dataset.node});return}
  b=t.closest("[data-file]");if(b&&b.closest("#panel")){choose({t:"file",id:+b.dataset.file});return}
  b=t.closest("[data-pend]");if(b){tab="resumen";choose({t:"pend",id:+b.dataset.pend});return}
  b=t.closest("[data-pendtab]");if(b){tab="pend";pfilter="all";render();return}
  b=t.closest("[data-more]");if(b){expandAll=true;render();return}
  b=t.closest("[data-pf]");if(b){pfilter=b.dataset.pf;renderPanel();return}
  b=t.closest("[data-tab]");if(b){tab=b.dataset.tab;if(tab==="resumen"&&!sel){}render();return}
  b=t.closest("[data-focus]");if(b){focus=b.dataset.focus==="1";render();return}
  b=t.closest("[data-depth]");if(b){depth=+b.dataset.depth;render();return}
});
function setView(v){
  view=v;try{localStorage.setItem("valu-map-view",v)}catch(e){}
  render();
  if(v==="red"&&sel)Net.fitSelection();
}
$("#clearBtn").addEventListener("click",function(){sel=null;tab="resumen";render();if(view==="red")Net.zoom("fit")});
$("#closeSheet").addEventListener("click",function(){document.body.classList.remove("sheet")});
$("#copyBtn").addEventListener("click",function(){
  var btn=this,txt=lastText||"";
  function done(m){btn.textContent=m;setTimeout(function(){btn.textContent="Copiar"},1400)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){done("Copiado")},function(){done("No se pudo")})}
  else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done("Copiado")}catch(e){done("No se pudo")}document.body.removeChild(ta)}
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="/"&&document.activeElement!==q){ev.preventDefault();q.focus()}
  if(ev.key==="Escape"&&document.activeElement!==q&&sel){sel=null;render()}
});
var rt=null;
window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(drawWires,120)});
var themeBtn=$("#themeBtn"),root=document.documentElement;
try{var saved=localStorage.getItem("valu-map-theme");if(saved)root.setAttribute("data-theme",saved)}catch(e){}
themeBtn.addEventListener("click",function(){
  var cur=root.getAttribute("data-theme");
  var dark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
  var nxt=dark?"light":"dark";root.setAttribute("data-theme",nxt);
  try{localStorage.setItem("valu-map-theme",nxt)}catch(e){}
  Net.refreshColors();
});
if(window.matchMedia){try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){Net.refreshColors()})}catch(e){}}
$("#hmeta").textContent=D.meta.files+" archivos · "+D.meta.nodes+" elementos · "+D.meta.edges+" conexiones"+(D.meta.commit?" · grafo @"+D.meta.commit:"");
render();
})();
</script>
</body>
</html>
