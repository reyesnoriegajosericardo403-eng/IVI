<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de VALU</title>
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef1f5; --line:#d3dae3; --text:#18222e; --muted:#5a6676;
  --uses:#0a7fc2; --usedby:#16905f; --both:#b36b00; --pend:#d6336c; --ind:#8793a3; --focus:#2563eb;
  --shadow:0 8px 28px rgba(15,23,42,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1118; --surface:#141b24; --surface2:#1b2430; --line:#2a3544; --text:#e6edf5; --muted:#8e9bad;
    --uses:#4cc2ff; --usedby:#5fd7a5; --both:#ffc857; --pend:#ff6b9d; --ind:#6b7788; --focus:#7aa7ff;
    --shadow:0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1118; --surface:#141b24; --surface2:#1b2430; --line:#2a3544; --text:#e6edf5; --muted:#8e9bad;
  --uses:#4cc2ff; --usedby:#5fd7a5; --both:#ffc857; --pend:#ff6b9d; --ind:#6b7788; --focus:#7aa7ff;
  --shadow:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
header{display:flex;gap:10px;min-width:0;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:20}
.brand{font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:0}
.search{position:relative;flex:1;min-width:0;max-width:680px}
#q{width:100%;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;outline:none}
#q:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);max-height:72vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;padding:6px}
#results.on{display:block}
.rh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 8px 4px}
.res{all:unset;box-sizing:border-box;display:flex;gap:8px;align-items:baseline;width:100%;padding:7px 8px;border-radius:8px;cursor:pointer}
.res:hover,.res:focus-visible,.res.on{background:var(--surface2)}
.res .rl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.res .rp{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sug{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--surface2)}
.chip:hover{border-color:var(--focus)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip:focus-visible,.tile:focus-visible,.group-head:focus-visible,.pbtn:focus-visible,.res:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hmeta{color:var(--muted);font-size:12px;margin-left:auto;text-align:right;white-space:nowrap}
.ibtn{all:unset;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.ibtn:hover{border-color:var(--focus)}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;min-width:0}
#boardWrap{overflow:auto;position:relative;min-width:0;-webkit-overflow-scrolling:touch}
#toolbar{position:sticky;top:0;z-index:12;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12.5px}
#toolbar .grow{flex:1}
.legend{display:flex;gap:12px;align-items:center;color:var(--muted)}
.lg{display:inline-flex;gap:5px;align-items:center}
.lg i{display:inline-block;width:18px;height:0;border-top:3px solid var(--ind);border-radius:2px}
.lg.u i{border-color:var(--uses)} .lg.b i{border-color:var(--usedby)} .lg.a i{border-color:var(--both)}
.lg.p i{width:9px;height:9px;border:0;border-radius:50%;background:var(--pend)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:12.5px}
.seg button.on{background:var(--text);color:var(--bg)}
#board{position:relative;padding:14px 14px 40px}
#wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:6}
.band{margin-bottom:18px}
.band-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:0 2px 8px}
.bt{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.bs{color:var(--muted);font-size:12.5px}
.bc{color:var(--muted);font-size:12px;margin-left:auto}
.groups{display:flex;flex-wrap:wrap;gap:10px}
.group{flex:1 1 var(--basis,300px);min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 8px 10px}
.group.sel{box-shadow:0 0 0 2px var(--text)}
.group-head{all:unset;box-sizing:border-box;display:flex;gap:8px;align-items:baseline;width:100%;cursor:pointer;padding:2px 4px 6px}
.group-head b{font-size:13px}
.group-head code{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.group-head i{font-style:normal;margin-left:auto;color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:6px}
.tile{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-height:46px;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer;transition:opacity .15s}
.tile:hover{border-color:var(--muted)}
.tn{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.tm{color:var(--muted);font-size:10.5px}
.pdot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--pend)}
#board.has-sel .tile{opacity:.3}
#board.has-sel .tile.sel,#board.has-sel .tile.rel{opacity:1}
.tile.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--text)}
.tile.r-out{border-color:var(--uses);box-shadow:0 0 0 1.5px var(--uses)}
.tile.r-in{border-color:var(--usedby);box-shadow:0 0 0 1.5px var(--usedby)}
.tile.r-both{border-color:var(--both);box-shadow:0 0 0 1.5px var(--both)}
.tile.r-ind{border-style:dashed;border-color:var(--ind)}
#board.has-sel .tile.r-ind{opacity:.75}
.hide{display:none!important}
#focusView{display:grid;grid-template-columns:repeat(var(--ncols,3),minmax(168px,1fr));column-gap:68px;align-items:start;min-width:calc(var(--ncols,3)*168px + (var(--ncols,3) - 1)*68px)}
.dcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.dch{display:flex;flex-direction:column;margin-bottom:4px}
.dch b{font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.dch span{color:var(--muted);font-size:12px}
.dgl{font-size:10.5px;color:var(--muted);margin:10px 0 0;letter-spacing:.03em;overflow-wrap:anywhere}
.dempty{color:var(--muted);font-size:12.5px;font-style:italic;padding:8px 0}
.dcard{border:2px solid var(--text);border-radius:12px;padding:10px 12px;background:var(--surface)}
.dcard .dt{font-weight:700;overflow-wrap:anywhere}
.dcard .dm{color:var(--muted);font-size:12px;overflow-wrap:anywhere;margin-top:2px}
.dmore{margin-top:6px;align-self:flex-start}
.dtile .tm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.w{fill:none;stroke-linecap:round}
.w-out{stroke:var(--uses)} .w-in{stroke:var(--usedby)} .w-both{stroke:var(--both)} .w-ind{stroke:var(--ind);stroke-dasharray:4 4}
.wn{fill:var(--surface);stroke-width:1.5}
.wt{font:600 10px ui-monospace,Menlo,monospace;fill:var(--text);text-anchor:middle;dominant-baseline:central}
#panel{border-left:1px solid var(--line);overflow:auto;background:var(--surface);-webkit-overflow-scrolling:touch}
.ptabs{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.ptabs .grow{flex:1}
.pbody{padding:14px 16px 40px}
.pbody h2{font-size:17px;line-height:1.3;margin:0 0 4px;overflow-wrap:anywhere}
.pbody h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:11.5px;color:var(--muted);margin-right:4px}
.tag.pk{color:var(--pend);border-color:var(--pend)}
.path{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.lead{margin:10px 0;font-size:14.5px;line-height:1.6}
.lead b{font-weight:650}
details.sec{border-top:1px solid var(--line);padding:6px 0}
details.sec>summary{cursor:pointer;font-weight:600;padding:4px 0;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";display:inline-block;width:14px;color:var(--muted)}
details.sec[open]>summary::before{content:"▾"}
details.sec>summary em{font-style:normal;color:var(--muted);font-weight:400;margin-left:6px}
.fg{margin:6px 0 10px}
.fl,.il,.link{all:unset;cursor:pointer;color:var(--focus)}
.fl{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.fl:hover,.il:hover,.link:hover{text-decoration:underline}
.fl em{font-style:normal;color:var(--muted);font-weight:400;margin-left:6px}
.fg ul,.plain{list-style:none;margin:2px 0 0 10px;padding:0 0 0 10px;border-left:2px solid var(--line)}
.fg li,.plain li{padding:1px 0;font-size:13px}
.rel{color:var(--muted);font-size:11.5px;margin-right:6px}
.more{color:var(--muted);font-size:12px;margin-left:10px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.card.done{opacity:.6}
.card b{overflow-wrap:anywhere}
.card p{margin:4px 0 6px;color:var(--muted);font-size:13px}
.ck{display:inline-block;width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px;margin-right:7px;vertical-align:-2px;position:relative}
.done .ck{background:var(--usedby);border-color:var(--usedby)}
.done .ck::after{content:"";position:absolute;left:3.5px;top:0;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.empty{color:var(--muted);font-style:italic;padding:12px 0}
.tip{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);margin:8px 0;font-size:13px;color:var(--muted)}
.hubs{list-style:none;margin:0;padding:0}
.hubs li{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.hubs .fl{font-weight:500}
@media (max-width: 880px){
  main{display:block;position:relative}
  #boardWrap{height:100%}
  #panel{position:fixed;left:0;right:0;bottom:0;height:48vh;border-left:0;border-top:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(105%);transition:transform .2s;z-index:25;border-radius:14px 14px 0 0}
  body.sheet #panel{transform:none}
  body.sheet #board{padding-bottom:52vh}
  .hmeta{display:none}
  .brand small{display:none}
  #focusView{grid-template-columns:repeat(var(--ncols,3),minmax(120px,1fr));column-gap:40px;min-width:calc(var(--ncols,3)*120px + (var(--ncols,3) - 1)*40px)}
  #board{padding-left:10px;padding-right:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Mapa de VALU<small>explorador del grafo</small></div>
    <div class="search">
      <input id="q" type="search" placeholder="Busca con tus palabras: notificaciones, voz, cetes, pendientes…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar en el mapa">
      <div id="results" role="listbox"></div>
    </div>
    <div class="hmeta" id="hmeta"></div>
    <button class="ibtn" id="themeBtn" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">Tema</button>
  </header>
  <main>
    <section id="boardWrap">
      <div id="toolbar">
        <span id="status" class="grow"></span>
        <span id="focusCtl" class="seg hide" role="group" aria-label="Qué mostrar">
          <button data-focus="1" class="on">Conexiones</button><button data-focus="0">Mapa completo</button>
        </span>
        <span id="depthCtl" class="seg hide" role="group" aria-label="Profundidad">
          <button data-depth="1" class="on">Directos</button><button data-depth="2">+1 nivel</button>
        </span>
        <button class="ibtn hide" id="clearBtn">Quitar selección</button>
        <span class="legend"><span class="lg u"><i></i>usa a</span><span class="lg b"><i></i>lo usan</span><span class="lg a"><i></i>ambos</span><span class="lg p"><i></i>pendiente</span></span>
      </div>
      <div id="board">
        <svg id="wires" aria-hidden="true">
          <defs>
            <marker id="m-out" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--uses)"/></marker>
            <marker id="m-in" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--usedby)"/></marker>
            <marker id="m-both" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--both)"/></marker>
            <marker id="m-ind" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ind)"/></marker>
          </defs>
          <g id="wg"></g>
        </svg>
        <div id="focusView" class="hide"></div>
        <div id="bands"></div>
      </div>
    </section>
    <aside id="panel" aria-live="polite">
      <div class="ptabs">
        <button class="chip on" data-tab="resumen">Resumen</button>
        <button class="chip" data-tab="pend" id="tabPend">Pendientes</button>
        <span class="grow"></span>
        <button class="ibtn" id="copyBtn" title="Copiar el resumen para pegarlo en un chat">Copiar</button>
        <button class="ibtn" id="closeSheet" title="Ocultar panel">Ocultar</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </main>
</div>
<script>
(function(){
"use strict";
var D=/*__DATA__*/null;
if(!D){document.body.textContent="Sin datos: ejecuta scripts/graphify-explorer/build.py";return;}

/* ---------- utilidades ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var fold=function(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()};
function stem(w){
  w=fold(w);
  if(w.length>4){
    if(/ciones$/.test(w))w=w.slice(0,-6)+"cion";
    else if(/es$/.test(w)&&w.length>5)w=w.slice(0,-2);
    else if(/s$/.test(w))w=w.slice(0,-1);
  }
  return w;
}
function toks(s){
  s=String(s).replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g,"$1 $2");
  return fold(s).split(/[^a-z0-9]+/).filter(Boolean).map(stem);
}
function md(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")}
function plural(n,a,b){return n+" "+(n===1?a:b)}
function listNames(arr,max){
  var a=arr.slice(0,max).map(function(x){return "«"+x+"»"});
  var rest=arr.length-a.length;
  if(!a.length)return "";
  var s=a.length>1?a.slice(0,-1).join(", ")+" y "+a[a.length-1]:a[0];
  return rest>0?s+" y "+plural(rest,"más","más"):s;
}

/* ---------- datos derivados ---------- */
var N=D.nodes,F=D.files,G=D.groups,E=D.edges,L=D.layers,P=D.pend;
var outE=N.map(function(){return []}),inE=N.map(function(){return []});
E.forEach(function(e){outE[e[0]].push([e[1],e[2]]);inE[e[1]].push([e[0],e[2]]);});
var nodesOfFile=F.map(function(){return []});
var fileNode=F.map(function(){return -1});
N.forEach(function(n,i){if(n.f>=0){nodesOfFile[n.f].push(i);if(n.k==="file")fileNode[n.f]=i;}});
var kids=N.map(function(){return []});
N.forEach(function(n,i){if(n.p>=0)kids[n.p].push(i);});
var filesOfGroup=G.map(function(){return []});
F.forEach(function(f,i){filesOfGroup[f.g].push(i)});
var fOut=F.map(function(){return new Map()}),fIn=F.map(function(){return new Map()});
E.forEach(function(e){
  var a=N[e[0]].f,b=N[e[1]].f;
  if(a<0||b<0||a===b)return;
  fOut[a].set(b,(fOut[a].get(b)||0)+1);fIn[b].set(a,(fIn[b].get(a)||0)+1);
});
var pendByFile=F.map(function(){return []});
P.forEach(function(p,i){p.fi.forEach(function(f){pendByFile[f].push(i)})});
var openPend=function(f){return pendByFile[f].filter(function(i){return !P[i].done})};

var KINDP={file:"un archivo",fn:"una función o componente",type:"un tipo o clase",doc:"una sección de documentación",idx:"un índice de base de datos",table:"una tabla de base de datos",sql:"un objeto de base de datos",cfg:"un ajuste de configuración",el:"un elemento de código"};
var KINDS={file:"archivo",fn:"función",type:"tipo",doc:"documentación",idx:"índice",table:"tabla",sql:"SQL",cfg:"ajuste",el:"elemento"};
var REL_OUT={calls:"llama a",imports:"importa",imports_from:"importa de",references:"referencia a",indirect_call:"llama (indirecto) a",indexes:"indexa",method:"tiene el método",inherits:"hereda de",triggers:"dispara",cites:"cita",extends:"extiende",dynamic_import:"importa (dinámico)"};
var REL_IN={calls:"lo llama",imports:"lo importa",imports_from:"lo importa",references:"lo referencia",indirect_call:"lo llama (indirecto)",indexes:"lo indexa",method:"es método de",inherits:"lo heredan",triggers:"lo dispara",cites:"lo cita",extends:"lo extienden",dynamic_import:"lo importa (dinámico)"};

/* ---------- construir tablero ---------- */
var tileEl=[],groupEl=[],bandEl=[];
(function build(){
  var host=$("#bands"),html="";
  L.forEach(function(layer,li){
    var gs=[];G.forEach(function(g,gi){if(g.layer===li)gs.push(gi)});
    if(!gs.length)return;
    var nf=0;gs.forEach(function(gi){nf+=filesOfGroup[gi].length});
    html+='<section class="band" data-layer="'+li+'"><div class="band-head"><span class="bt">'+esc(layer.title)+'</span><span class="bs">'+esc(layer.sub)+'</span><span class="bc">'+plural(nf,"archivo","archivos")+'</span></div><div class="groups">';
    gs.forEach(function(gi){
      var fs=filesOfGroup[gi],basis=Math.min(Math.max(fs.length,1),5)*136+18;
      html+='<div class="group" data-g="'+gi+'" style="--basis:'+basis+'px"><button class="group-head" data-g="'+gi+'"><b>'+esc(G[gi].label)+'</b><code>'+esc(G[gi].path)+'</code><i>'+fs.length+'</i></button><div class="tiles">';
      fs.forEach(function(fi){
        var f=F[fi],ext=(f.name.indexOf(".")>-1?f.name.split(".").pop():"");
        html+='<button class="tile" data-f="'+fi+'" title="'+esc(f.path)+'"><span class="tn">'+esc(f.name)+'</span><span class="tm">'+(f.n?f.n+" elem · ":"")+esc(ext)+'</span>'+(openPend(fi).length?'<span class="pdot" title="Tiene pendientes"></span>':"")+'</button>';
      });
      html+='</div></div>';
    });
    html+='</div></section>';
  });
  host.innerHTML=html;
  $$(".tile",host).forEach(function(el){tileEl[+el.dataset.f]=el});
  $$(".group",host).forEach(function(el){groupEl[+el.dataset.g]=el});

var sel=null,focus=true,depth=1,tab="resumen",pfilter="open",lastRel=null;

function relate(){
  var selFiles=new Set(),rel=new Map(),ind=new Map();
  function add(f,dir,n,name){
    if(f<0||selFiles.has(f))return;
    var r=rel.get(f);if(!r){r={out:0,inn:0,names:[]};rel.set(f,r)}
    if(dir==="out")r.out+=n;else r.inn+=n;
    if(name&&r.names.indexOf(name)<0)r.names.push(name);
  }
  if(sel.t==="node"){
    var n=N[sel.id];if(n.f>=0)selFiles.add(n.f);
    outE[sel.id].forEach(function(e){add(N[e[0]].f,"out",1,N[e[0]].l)});
    inE[sel.id].forEach(function(e){add(N[e[0]].f,"inn",1,N[e[0]].l)});
  }else if(sel.t==="file"){
    selFiles.add(sel.id);
    fOut[sel.id].forEach(function(c,g){add(g,"out",c)});
    fIn[sel.id].forEach(function(c,g){add(g,"inn",c)});
  }else if(sel.t==="group"){
    filesOfGroup[sel.id].forEach(function(f){selFiles.add(f)});
    selFiles.forEach(function(f){
      fOut[f].forEach(function(c,g){add(g,"out",c)});
      fIn[f].forEach(function(c,g){add(g,"inn",c)});
    });
  }else if(sel.t==="pend"){
    P[sel.id].fi.forEach(function(f){selFiles.add(f)});
  }
  if(depth>=2&&sel.t!=="pend"){
    rel.forEach(function(r,f){
      fOut[f].forEach(function(c,g){if(!selFiles.has(g)&&!rel.has(g)&&!ind.has(g))ind.set(g,1)});
      fIn[f].forEach(function(c,g){if(!selFiles.has(g)&&!rel.has(g)&&!ind.has(g))ind.set(g,1)});
    });
  }
  return {selFiles:selFiles,rel:rel,ind:ind};
}

function render(){
  var board=$("#board");
  var diagram=!!sel&&focus&&sel.t!=="pend";
  $("#focusCtl").classList.toggle("hide",!sel);
  $("#depthCtl").classList.toggle("hide",!sel||sel.t==="pend");
  $("#clearBtn").classList.toggle("hide",!sel);
  document.body.classList.toggle("sheet",!!sel||tab==="pend");
  $$("[data-focus]").forEach(function(b){b.classList.toggle("on",(b.dataset.focus==="1")===focus)});
  $$("[data-depth]").forEach(function(b){b.classList.toggle("on",+b.dataset.depth===depth)});
  $$(".ptabs [data-tab]").forEach(function(b){b.classList.toggle("on",b.dataset.tab===tab)});
  var nOpen=P.filter(function(p){return !p.done}).length;
  $("#tabPend").textContent="Pendientes ("+nOpen+")";

  tileEl.forEach(function(el){el.className="tile"});
  groupEl.forEach(function(el){el.classList.remove("sel","hide")});
  bandEl.forEach(function(el){el.classList.remove("hide")});
  board.classList.toggle("has-sel",!!sel);
  $("#bands").classList.toggle("hide",diagram);
  $("#focusView").classList.toggle("hide",!diagram);

  if(!sel){
    lastRel=null;
    $("#status").textContent=plural(F.length,"archivo","archivos")+" · toca un recuadro o busca algo";
    drawWires();renderPanel();return;
  }
  var R=lastRel=relate();
  if(diagram){
    renderDiagram(R);
    renderPanel();
    requestAnimationFrame(drawWires);
    return;
  }
  var visible=new Set();
  R.selFiles.forEach(function(f){visible.add(f);tileEl[f].classList.add("sel")});
  R.rel.forEach(function(r,f){
    visible.add(f);
    var el=tileEl[f];el.classList.add("rel");
    el.classList.add(r.out&&r.inn?"r-both":(r.out?"r-out":"r-in"));
  });
  R.ind.forEach(function(r,f){visible.add(f);tileEl[f].classList.add("rel","r-ind")});
  if(sel.t==="group")groupEl[sel.id].classList.add("sel");
  if(focus){
    var gCount=G.map(function(){return 0}),lCount=L.map(function(){return 0});
    tileEl.forEach(function(el,f){
      var show=visible.has(f);el.classList.toggle("hide",!show);
      if(show)gCount[F[f].g]++;
    });
    groupEl.forEach(function(el,g){
      var show=gCount[g]>0;el.classList.toggle("hide",!show);
      if(show)lCount[G[g].layer]++;
    });
    bandEl.forEach(function(el,l){el.classList.toggle("hide",lCount[l]===0)});
    $("#status").textContent="Mostrando "+visible.size+" de "+F.length+" archivos ligados a este pendiente";
  }else{
    $("#status").textContent="Mapa completo · "+(R.rel.size+R.ind.size)+" archivos conectados resaltados";
  }
  drawWires();renderPanel();
}

function renderDiagram(R){
  var l1=[],r1=[],l2=new Map(),r2=new Map();
  function names(r){return r.names&&r.names.length?r.names.slice(0,2).join(", ")+(r.names.length>2?" +"+(r.names.length-2):""):""}
  R.rel.forEach(function(r,f){
    if(r.out)r1.push({f:f,html:dtile(f,"r1",r.inn?"r-both":"r-out",names(r),null,r.out+r.inn),both:!!r.inn});
    else l1.push({f:f,html:dtile(f,"l1","r-in",names(r),null,r.inn)});
  });
  if(depth>=2){
    function best(map,g,via,c){var o=map.get(g);if(!o||c>o.c)map.set(g,{via:via,c:c})}
    R.rel.forEach(function(r,f){
      if(r.out)fOut[f].forEach(function(c,g){if(!R.selFiles.has(g)&&!R.rel.has(g))best(r2,g,f,c)});
      else fIn[f].forEach(function(c,g){if(!R.selFiles.has(g)&&!R.rel.has(g))best(l2,g,f,c)});
    });
  }
  var L2=[],R2=[];

  r2.forEach(function(o,g){R2.push({f:g,html:dtile(g,"r2","r-ind","",o.via,o.c)})});
  [l1,r1,L2,R2].forEach(function(a){a.sort(function(x,y){return sortFiles(x.f,y.f)})});

  var center;

    var n=N[sel.id];
    center='<div class="dcard" id="dcenter"><span class="tag">'+esc(KINDS[n.k]||"elemento")+'</span><div class="dt">'+esc(n.l)+'</div><div class="dm">'+(n.f>=0?esc(F[n.f].path)+(n.ln?":"+n.ln:""):"")+'</div></div>';
  }else if(sel.t==="group"){
    var g=G[sel.id];
    center='<div class="dcard" id="dcenter"><span class="tag">carpeta</span><div class="dt">'+esc(g.label)+'</div><div class="dm">'+esc(g.path)+' · '+plural(filesOfGroup[sel.id].length,"archivo","archivos")+'</div></div>';
  }else{
    var ff=F[sel.id];
    center='<div class="dcard" id="dcenter"><span class="tag">archivo</span><div class="dt mono" style="font-size:13px">'+esc(ff.name)+'</div><div class="dm">'+esc(ff.path)+'</div></div>';
  }
  var cols=[];
  if(depth>=2&&L2.length)cols.push(dcol("2 niveles atrás","usan a los que lo usan",L2,""));
  cols.push(dcol("Lo usan",plural(l1.length,"archivo","archivos"),l1,"Ningún otro archivo lo usa directamente"));
  cols.push('<div class="dcol"><div class="dch"><b>Elegido</b><span>'+esc(whereIs(sel.t==="node"?N[sel.id].f:(sel.t==="file"?sel.id:filesOfGroup[sel.id][0])).replace(/[«»]/g,""))+'</span></div>'+center+'</div>');
  cols.push(dcol("Usa a",plural(r1.length,"archivo","archivos")+(r1.some(function(x){return x.both})?" · ámbar = también lo usa":""),r1,"No depende de otros archivos"));
  if(depth>=2&&R2.length)cols.push(dcol("2 niveles adelante","lo que usan sus dependencias",R2,""));
  var fv=$("#focusView");

var SVGNS="http://www.w3.org/2000/svg";
function drawWires(){
  var g=$("#wg"),svg=$("#wires"),board=$("#board");
  while(g.firstChild)g.removeChild(g.firstChild);
  var fv=$("#focusView");
  var bb=board.getBoundingClientRect();
  svg.setAttribute("width",Math.ceil(Math.max(bb.width,fv.scrollWidth+28)));
  svg.setAttribute("height",Math.ceil(Math.max(bb.height,board.scrollHeight)));
  if(!sel||!focus||sel.t==="pend"||fv.classList.contains("hide"))return;
  var c=$("#dcenter");if(!c)return;
  function rect(el){var r=el.getBoundingClientRect();return {x:r.left-bb.left,y:r.top-bb.top,w:r.width,h:r.height}}
  var C=rect(c),portR={x:C.x+C.w,y:C.y+C.h/2},portL={x:C.x,y:C.y+C.h/2};
  var list=[];
  $$('[data-col="r1"]',fv).forEach(function(el){
    var T=rect(el),both=el.classList.contains("r-both");
    list.push({a:portR,b:{x:T.x,y:T.y+T.h/2},k:both?"both":"out",n:+el.dataset.n});
  });
  $$('[data-col="l1"]',fv).forEach(function(el){
    var T=rect(el);list.push({a:{x:T.x+T.w,y:T.y+T.h/2},b:portL,k:"in",n:+el.dataset.n});
  });
  function via(col,viaCol,toRight){
    $$('[data-col="'+col+'"]',fv).forEach(function(el){
      var p=fv.querySelector('[data-col="'+viaCol+'"][data-f="'+el.dataset.via+'"]');if(!p)return;
      var T=rect(el),V=rect(p);
      if(toRight)list.push({a:{x:V.x+V.w,y:V.y+V.h/2},b:{x:T.x,y:T.y+T.h/2},k:"ind",n:1});
      else list.push({a:{x:T.x+T.w,y:T.y+T.h/2},b:{x:V.x,y:V.y+V.h/2},k:"ind",n:1});
    });
  }
  via("r2","r1",true);via("l2","l1",false);
  list.sort(function(p,q){return (p.k==="ind"?0:1)-(q.k==="ind"?0:1)});
  list.forEach(function(w){
    var dx=w.b.x-w.a.x,off=Math.max(28,Math.abs(dx)*0.5)*(dx<0?-1:1);
    var d="M"+w.a.x+" "+w.a.y+" C"+(w.a.x+off)+" "+w.a.y+","+(w.b.x-off)+" "+w.b.y+","+w.b.x+" "+w.b.y;
    var p=document.createElementNS(SVGNS,"path");
    p.setAttribute("d",d);p.setAttribute("class","w w-"+w.k);
    p.setAttribute("stroke-width",w.k==="ind"?1.3:(1.6+Math.min(2.6,Math.log2(w.n)*0.8)).toFixed(2));
    p.setAttribute("marker-end","url(#m-"+w.k+")");
    if(w.k==="both")p.setAttribute("marker-start","url(#m-both)");
    g.appendChild(p);
    if(w.n>1&&w.k!=="ind"){
      var len=p.getTotalLength(),m=p.getPointAtLength(len*(w.a===portR?0.76:0.24));
      var ci=document.createElementNS(SVGNS,"circle");ci.setAttribute("cx",m.x);ci.setAttribute("cy",m.y);ci.setAttribute("r",9);ci.setAttribute("class","wn w-"+w.k);
      var tx=document.createElementNS(SVGNS,"text");tx.setAttribute("x",m.x);tx.setAttribute("y",m.y);tx.setAttribute("class","wt");tx.textContent=w.n;
      g.appendChild(ci);g.appendChild(tx);
    }
  });
}

function bucket(list,selfF){
  var m=new Map(),same=[];
  list.forEach(function(e){
    var f=N[e[0]].f;
    if(f===selfF){same.push(e);return}
    if(!m.has(f))m.set(f,[]);m.get(f).push(e);
  });
  var arr=[];m.forEach(function(items,f){arr.push({f:f,items:items})});
  arr.sort(function(a,b){return b.items.length-a.items.length||(a.f-b.f)});
  return {same:same,files:arr};
}

var IDX=[];
(function indexAll(){
  function layerToks(f){var g=G[F[f].g];return toks(L[g.layer].title+" "+g.label+" "+g.path)}
  F.forEach(function(f,i){
    IDX.push({t:"file",id:i,lab:toks(f.name),pth:toks(f.path).concat(layerToks(i)),w:0.6,deg:fOut[i].size+fIn[i].size,txt:f.name,sub:f.path});

  });
  G.forEach(function(g,i){IDX.push({t:"group",id:i,lab:toks(g.label+" "+g.path),pth:toks(L[g.layer].title),w:0.2,deg:filesOfGroup[i].length,txt:g.label,sub:g.path})});
  P.forEach(function(p,i){IDX.push({t:"pend",id:i,lab:toks(p.title+" "+p.detail+" "+p.req.join(" ")+" pendiente"),pth:toks(p.files.join(" ")),w:1.2,deg:0,txt:p.title,sub:p.req.join(", ")})});

function cpl(a,b){var i=0,m=Math.min(a.length,b.length);while(i<m&&a[i]===b[i])i++;return i}
function mt(q,t,wE,wS,wF){
  if(t===q.s)return wE;
  if(q.alts.has(t))return wS;
  var m=Math.min(t.length,q.s.length);
  if(m>=4&&(t.indexOf(q.s)===0||q.s.indexOf(t)===0))return wF;
  var p=cpl(t,q.s);
  if(p>=5&&p>=Math.ceil(0.6*m))return wF*0.8;
  return 0;
}
function key(s){return fold(s).replace(/[^a-z0-9]+/g,"")}
function search(text){
  var qs=toks(text).filter(function(w){return !STOP.has(w)}).map(function(w){return {s:w,alts:expand(w)}});
  if(!qs.length)return [];
  var full=fold(text.trim()),res=[];
  IDX.forEach(function(e){
    var tot=0,hit=0;
    qs.forEach(function(q){
      var best=0;
      e.lab.forEach(function(t){var v=mt(q,t,3,1.6,1.5);if(v>best)best=v});
      e.pth.forEach(function(t){var v=mt(q,t,1.4,.8,.7);if(v>best)best=v});
      if(best>0){hit++;tot+=best}
    });
    if(!hit)return;
    var s=tot*(hit===qs.length?1.6:1)+hit/qs.length+e.w+0.25*Math.log2(1+e.deg);
    if(key(e.txt)===key(text))s+=6;
    res.push({e:e,s:s,full:hit===qs.length});
  });
  var anyFull=res.some(function(r){return r.full});
  if(anyFull){var fullN=res.filter(function(r){return r.full}).length;if(fullN>=4)res=res.filter(function(r){return r.full})}
  res.sort(function(a,b){return b.s-a.s});
  return res;
}
