<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de VALU</title>
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef1f5; --line:#d3dae3; --text:#18222e; --muted:#5a6676;
  --uses:#0a7fc2; --usedby:#16905f; --both:#b36b00; --pend:#d6336c; --ind:#8793a3; --focus:#2563eb;
  --shadow:0 8px 28px rgba(15,23,42,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1118; --surface:#141b24; --surface2:#1b2430; --line:#2a3544; --text:#e6edf5; --muted:#8e9bad;
    --uses:#4cc2ff; --usedby:#5fd7a5; --both:#ffc857; --pend:#ff6b9d; --ind:#6b7788; --focus:#7aa7ff;
    --shadow:0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1118; --surface:#141b24; --surface2:#1b2430; --line:#2a3544; --text:#e6edf5; --muted:#8e9bad;
  --uses:#4cc2ff; --usedby:#5fd7a5; --both:#ffc857; --pend:#ff6b9d; --ind:#6b7788; --focus:#7aa7ff;
  --shadow:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
header{display:flex;gap:10px;min-width:0;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:20}
.brand{font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:0}
.search{position:relative;flex:1;min-width:0;max-width:680px}
#q{width:100%;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;outline:none}
#q:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;padding:6px}
#results.on{display:block}
.rh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 8px 4px}
.res{all:unset;box-sizing:border-box;display:flex;gap:8px;align-items:baseline;width:100%;padding:7px 8px;border-radius:8px;cursor:pointer}
.res:hover,.res:focus-visible,.res.on{background:var(--surface2)}
.res .rl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.res .rp{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sug{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--surface2)}
.chip:hover{border-color:var(--focus)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip:focus-visible,.tile:focus-visible,.group-head:focus-visible,.pbtn:focus-visible,.res:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hmeta{color:var(--muted);font-size:12px;margin-left:auto;text-align:right;white-space:nowrap}
.ibtn{all:unset;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.ibtn:hover{border-color:var(--focus)}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;min-width:0}
#boardWrap{display:flex;flex-direction:column;position:relative;min-width:0;min-height:0;overflow:hidden}
#fichas{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
#netView{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--bg)}
.v-red #fichas{display:none}
.v-fichas #netView{display:none}
.v-red.nosel .legend{display:none}
#net{display:block;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#net.pointing{cursor:pointer}
#net.grabbing{cursor:grabbing}
#netTip{position:absolute;z-index:6;pointer-events:none;max-width:280px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);box-shadow:var(--shadow);font-size:12px;line-height:1.45}
#netLegend{position:absolute;right:10px;top:10px;z-index:4;display:flex;flex-direction:column;gap:1px;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:11.5px;opacity:.96;min-width:150px}
.lgh{all:unset;cursor:pointer;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 2px 3px;display:flex;justify-content:space-between}
.lgd{all:unset;cursor:pointer;display:flex;gap:7px;align-items:center;padding:2px 2px}
.lgd i{width:9px;height:9px;border-radius:50%;flex:none}
.lgd em{font-style:normal;color:var(--muted);margin-left:auto;padding-left:10px}
.lgd.off{opacity:.35}
#netZoom{position:absolute;right:10px;bottom:10px;z-index:4;display:flex;flex-direction:column;gap:6px}
#netZoom button{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:18px;line-height:1}
#netZoom button:hover{border-color:var(--focus)}
.netctl{display:inline-flex;gap:8px;align-items:center}
#toolbar{flex:none;z-index:12;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12.5px}
#toolbar .grow{flex:1}
.legend{display:flex;gap:12px;align-items:center;color:var(--muted)}
.lg{display:inline-flex;gap:5px;align-items:center}
.lg i{display:inline-block;width:18px;height:0;border-top:3px solid var(--ind);border-radius:2px}
.lg.u i{border-color:var(--uses)} .lg.b i{border-color:var(--usedby)} .lg.a i{border-color:var(--both)}
.lg.p i{width:9px;height:9px;border:0;border-radius:50%;background:var(--pend)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:12.5px}
.seg button.on{background:var(--text);color:var(--bg)}
#board{position:relative;padding:14px 14px 40px}
#wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:6}
.band{margin-bottom:18px}
.band-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:0 2px 8px}
.bt{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.bs{color:var(--muted);font-size:12.5px}
.bc{color:var(--muted);font-size:12px;margin-left:auto}
.groups{display:flex;flex-wrap:wrap;gap:10px}
.group{flex:1 1 var(--basis,300px);min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 8px 10px}
.group.sel{box-shadow:0 0 0 2px var(--text)}
.group-head{all:unset;box-sizing:border-box;display:flex;gap:8px;align-items:baseline;width:100%;cursor:pointer;padding:2px 4px 6px}
.group-head b{font-size:13px}
.group-head code{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.group-head i{font-style:normal;margin-left:auto;color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:6px}
.tile{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-height:46px;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer;transition:opacity .15s}
.tile:hover{border-color:var(--muted)}
.tn{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.tm{color:var(--muted);font-size:10.5px}
.pdot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--pend)}
#board.has-sel .tile{opacity:.3}
#board.has-sel .tile.sel,#board.has-sel .tile.rel{opacity:1}
.tile.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--text)}
.tile.r-out{border-color:var(--uses);box-shadow:0 0 0 1.5px var(--uses)}
.tile.r-in{border-color:var(--usedby);box-shadow:0 0 0 1.5px var(--usedby)}
.tile.r-both{border-color:var(--both);box-shadow:0 0 0 1.5px var(--both)}
.tile.r-ind{border-style:dashed;border-color:var(--ind)}
#board.has-sel .tile.r-ind{opacity:.75}
.hide{display:none!important}
#focusView{display:grid;grid-template-columns:repeat(var(--ncols,3),minmax(168px,1fr));column-gap:68px;align-items:start;min-width:calc(var(--ncols,3)*168px + (var(--ncols,3) - 1)*68px)}
.dcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.dch{display:flex;flex-direction:column;margin-bottom:4px}
.dch b{font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.dch span{color:var(--muted);font-size:12px}
.dgl{font-size:10.5px;color:var(--muted);margin:10px 0 0;letter-spacing:.03em;overflow-wrap:anywhere}
.dempty{color:var(--muted);font-size:12.5px;font-style:italic;padding:8px 0}
.dcard{border:2px solid var(--text);border-radius:12px;padding:10px 12px;background:var(--surface)}
.dcard .dt{font-weight:700;overflow-wrap:anywhere}
.dcard .dm{color:var(--muted);font-size:12px;overflow-wrap:anywhere;margin-top:2px}
.dmore{margin-top:6px;align-self:flex-start}
.dtile .tm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.w{fill:none;stroke-linecap:round}
.w-out{stroke:var(--uses)} .w-in{stroke:var(--usedby)} .w-both{stroke:var(--both)} .w-ind{stroke:var(--ind);stroke-dasharray:4 4}
.wn{fill:var(--surface);stroke-width:1.5}
.wt{font:600 10px ui-monospace,Menlo,monospace;fill:var(--text);text-anchor:middle;dominant-baseline:central}
#panel{border-left:1px solid var(--line);overflow:auto;background:var(--surface);-webkit-overflow-scrolling:touch}
.ptabs{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.ptabs .grow{flex:1}
#closeSheet{display:none}
.pbody{padding:14px 16px 40px}
.pbody h2{font-size:17px;line-height:1.3;margin:0 0 4px;overflow-wrap:anywhere}
.pbody h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:11.5px;color:var(--muted);margin-right:4px}
.tag.pk{color:var(--pend);border-color:var(--pend)}
.path{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.lead{margin:10px 0;font-size:14.5px;line-height:1.6}
.lead b{font-weight:650}
details.sec{border-top:1px solid var(--line);padding:6px 0}
details.sec>summary{cursor:pointer;font-weight:600;padding:4px 0;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";display:inline-block;width:14px;color:var(--muted)}
details.sec[open]>summary::before{content:"▾"}
details.sec>summary em{font-style:normal;color:var(--muted);font-weight:400;margin-left:6px}
.fg{margin:6px 0 10px}
.fl,.il,.link{all:unset;cursor:pointer;color:var(--focus)}
.fl{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.fl:hover,.il:hover,.link:hover{text-decoration:underline}
.fl em{font-style:normal;color:var(--muted);font-weight:400;margin-left:6px}
.fg ul,.plain{list-style:none;margin:2px 0 0 10px;padding:0 0 0 10px;border-left:2px solid var(--line)}
.fg li,.plain li{padding:1px 0;font-size:13px}
.rel{color:var(--muted);font-size:11.5px;margin-right:6px}
.more{color:var(--muted);font-size:12px;margin-left:10px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.card.done{opacity:.6}
.card b{overflow-wrap:anywhere}
.card p{margin:4px 0 6px;color:var(--muted);font-size:13px}
.ck{display:inline-block;width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px;margin-right:7px;vertical-align:-2px;position:relative}
.done .ck{background:var(--usedby);border-color:var(--usedby)}
.done .ck::after{content:"";position:absolute;left:3.5px;top:0;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.empty{color:var(--muted);font-style:italic;padding:12px 0}
.tip{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);margin:8px 0;font-size:13px;color:var(--muted)}
.hubs{list-style:none;margin:0;padding:0}
.hubs li{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.hubs .fl{font-weight:500}
@media (max-width: 880px){
  main{display:block;position:relative}
  #boardWrap{height:100%}
  #netLegend{font-size:10.5px;padding:4px 6px;min-width:0}
  #toolbar{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:6px 10px;-webkit-overflow-scrolling:touch}
  #toolbar>*{flex:none}
  #status,.legend{display:none!important}
  #closeSheet{display:inline-block}
  #panel{position:fixed;left:0;right:0;bottom:0;height:48vh;border-left:0;border-top:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(105%);transition:transform .2s;z-index:25;border-radius:14px 14px 0 0}
  body.sheet #panel{transform:none}
  body.sheet #board{padding-bottom:52vh}
  .hmeta{display:none}
  .brand small{display:none}
  #focusView{grid-template-columns:repeat(var(--ncols,3),minmax(120px,1fr));column-gap:40px;min-width:calc(var(--ncols,3)*120px + (var(--ncols,3) - 1)*40px)}
  #board{padding-left:10px;padding-right:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Mapa de VALU<small>explorador del grafo</small></div>
    <div class="search">
      <input id="q" type="search" placeholder="Busca con tus palabras: notificaciones, voz, cetes, pendientes…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar en el mapa">
      <div id="results" role="listbox"></div>
    </div>
    <div class="hmeta" id="hmeta"></div>
    <button class="ibtn" id="themeBtn" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">Tema</button>
  </header>
  <main>
    <section id="boardWrap">
      <div id="toolbar">
        <span id="viewCtl" class="seg" role="group" aria-label="Vista"><button data-view="red" class="on">Red</button><button data-view="fichas">Fichas</button></span>
        <span id="status" class="grow"></span>
        <span id="netCtl" class="netctl"><span class="seg" role="group" aria-label="Disposición de la red"><button data-layout="capas" class="on">Capas</button><button data-layout="libre">Libre</button></span><button class="chip" id="symBtn" aria-pressed="false" title="Mostrar también las funciones, componentes y secciones de cada archivo">Funciones</button><button class="chip" id="lblBtn" title="Cuántos nombres de archivo mostrar en la red">Nombres: auto</button><button class="chip on" id="edgeBtn" aria-pressed="true" title="Mostrar u ocultar las líneas de dependencia">Cables</button></span>
        <span id="focusCtl" class="seg hide" role="group" aria-label="Qué mostrar">
          <button data-focus="1" class="on">Conexiones</button><button data-focus="0">Mapa completo</button>
        </span>
        <span id="depthCtl" class="seg hide" role="group" aria-label="Profundidad">
          <button data-depth="1" class="on">Directos</button><button data-depth="2">+1 nivel</button>
        </span>
        <button class="ibtn hide" id="clearBtn">Quitar selección</button>
        <span class="legend"><span class="lg u"><i></i>usa a</span><span class="lg b"><i></i>lo usan</span><span class="lg a"><i></i>ambos</span><span class="lg p"><i></i>pendiente</span></span>
      </div>
      <div id="fichas">
      <div id="board">
        <svg id="wires" aria-hidden="true">
          <defs>
            <marker id="m-out" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--uses)"/></marker>
            <marker id="m-in" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--usedby)"/></marker>
            <marker id="m-both" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--both)"/></marker>
            <marker id="m-ind" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ind)"/></marker>
          </defs>
          <g id="wg"></g>
        </svg>
        <div id="focusView" class="hide"></div>
        <div id="bands"></div>
      </div>
      </div>
      <div id="netView" aria-label="Red de archivos del proyecto">
        <canvas id="net" role="img" aria-label="Red de archivos: cada punto es un archivo y las líneas son dependencias"></canvas>
        <div id="netTip" class="hide"></div>
        <div id="netLegend"></div>
        <div id="netZoom"><button data-zoom="in" title="Acercar" aria-label="Acercar">+</button><button data-zoom="out" title="Alejar" aria-label="Alejar">−</button><button data-zoom="fit" title="Ver todo / ajustar a la selección" aria-label="Ajustar">⤢</button></div>
      </div>
    </section>
    <aside id="panel" aria-live="polite">
      <div class="ptabs">
        <button class="chip on" data-tab="resumen">Resumen</button>
        <button class="chip" data-tab="pend" id="tabPend">Pendientes</button>
        <span class="grow"></span>
        <button class="ibtn" id="copyBtn" title="Copiar el resumen para pegarlo en un chat">Copiar</button>
        <button class="ibtn" id="closeSheet" title="Ocultar panel">Ocultar</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </main>
</div>
<script>
(function(){
"use strict";
var D=/*__DATA__*/null;
if(!D){document.body.textContent="Sin datos: ejecuta scripts/graphify-explorer/build.py";return;}

/* ---------- utilidades ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var fold=function(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()};
function stem(w){
  w=fold(w);
  if(w.length>4){
    if(/ciones$/.test(w))w=w.slice(0,-6)+"cion";
    else if(/es$/.test(w)&&w.length>5)w=w.slice(0,-2);
    else if(/s$/.test(w))w=w.slice(0,-1);
  }
  return w;
}
function toks(s){
  s=String(s).replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g,"$1 $2");
  return fold(s).split(/[^a-z0-9]+/).filter(Boolean).map(stem);
}
function md(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")}
function plural(n,a,b){return n+" "+(n===1?a:b)}
function listNames(arr,max){
  var a=arr.slice(0,max).map(function(x){return "«"+x+"»"});
  var rest=arr.length-a.length;
  if(!a.length)return "";
  var s=a.length>1?a.slice(0,-1).join(", ")+" y "+a[a.length-1]:a[0];
  return rest>0?s+" y "+plural(rest,"más","más"):s;
}

/* ---------- datos derivados ---------- */
var N=D.nodes,F=D.files,G=D.groups,E=D.edges,L=D.layers,P=D.pend;
var outE=N.map(function(){return []}),inE=N.map(function(){return []});
E.forEach(function(e){outE[e[0]].push([e[1],e[2]]);inE[e[1]].push([e[0],e[2]]);});
var nodesOfFile=F.map(function(){return []});
var fileNode=F.map(function(){return -1});
N.forEach(function(n,i){if(n.f>=0){nodesOfFile[n.f].push(i);if(n.k==="file")fileNode[n.f]=i;}});
var kids=N.map(function(){return []});

function relate(){
  var selFiles=new Set(),rel=new Map(),ind=new Map();
  function add(f,dir,n,name){
    if(f<0||selFiles.has(f))return;
    var r=rel.get(f);if(!r){r={out:0,inn:0,names:[]};rel.set(f,r)}
    if(dir==="out")r.out+=n;else r.inn+=n;
    if(name&&r.names.indexOf(name)<0)r.names.push(name);
  }
  if(sel.t==="node"){
    var n=N[sel.id];if(n.f>=0)selFiles.add(n.f);
    outE[sel.id].forEach(function(e){add(N[e[0]].f,"out",1,N[e[0]].l)});
    inE[sel.id].forEach(function(e){add(N[e[0]].f,"inn",1,N[e[0]].l)});
  }else if(sel.t==="file"){
    selFiles.add(sel.id);
    fOut[sel.id].forEach(function(c,g){add(g,"out",c)});
    fIn[sel.id].forEach(function(c,g){add(g,"inn",c)});
  }else if(sel.t==="group"){
    filesOfGroup[sel.id].forEach(function(f){selFiles.add(f)});
    selFiles.forEach(function(f){
      fOut[f].forEach(function(c,g){add(g,"out",c)});
      fIn[f].forEach(function(c,g){add(g,"inn",c)});
    });
  }else if(sel.t==="pend"){
    P[sel.id].fi.forEach(function(f){selFiles.add(f)});
  }
  if(depth>=2&&sel.t!=="pend"){
    rel.forEach(function(r,f){
      fOut[f].forEach(function(c,g){if(!selFiles.has(g)&&!rel.has(g)&&!ind.has(g))ind.set(g,1)});
      fIn[f].forEach(function(c,g){if(!selFiles.has(g)&&!rel.has(g)&&!ind.has(g))ind.set(g,1)});
    });
  }
  return {selFiles:selFiles,rel:rel,ind:ind};
}

    else{var nO=0,nI=0;Rr.rel.forEach(function(r){if(r.out)nO++;else nI++});$("#status").textContent=plural(nI,"archivo","archivos")+" lo "+(nI===1?"usa":"usan")+" · usa a "+plural(nO,"archivo","archivos")}

  board.classList.toggle("has-sel",!!sel);
  $("#bands").classList.toggle("hide",diagram);

    lastRel=null;

  if(sel.t==="group")groupEl[sel.id].classList.add("sel");
  if(focus){
    var gCount=G.map(function(){return 0}),lCount=L.map(function(){return 0});
    tileEl.forEach(function(el,f){
      var show=visible.has(f);el.classList.toggle("hide",!show);

    $("#status").textContent="Mostrando "+visible.size+" de "+F.length+" archivos ligados a este pendiente";
  }else{

function renderDiagram(R){
  var l1=[],r1=[],l2=new Map(),r2=new Map();
  function names(r){return r.names&&r.names.length?r.names.slice(0,2).join(", ")+(r.names.length>2?" +"+(r.names.length-2):""):""}
  R.rel.forEach(function(r,f){
    if(r.out)r1.push({f:f,html:dtile(f,"r1",r.inn?"r-both":"r-out",names(r),null,r.out+r.inn),both:!!r.inn});
    else l1.push({f:f,html:dtile(f,"l1","r-in",names(r),null,r.inn)});
  });
  if(depth>=2){
    function best(map,g,via,c){var o=map.get(g);if(!o||c>o.c)map.set(g,{via:via,c:c})}
    R.rel.forEach(function(r,f){
      if(r.out)fOut[f].forEach(function(c,g){if(!R.selFiles.has(g)&&!R.rel.has(g))best(r2,g,f,c)});
      else fIn[f].forEach(function(c,g){if(!R.selFiles.has(g)&&!R.rel.has(g))best(l2,g,f,c)});
    });
  }
  var L2=[],R2=[];

  r2.forEach(function(o,g){R2.push({f:g,html:dtile(g,"r2","r-ind","",o.via,o.c)})});
  [l1,r1,L2,R2].forEach(function(a){a.sort(function(x,y){return sortFiles(x.f,y.f)})});

  var center;

    var n=N[sel.id];

  }else if(sel.t==="group"){

    center='<div class="dcard" id="dcenter"><span class="tag">carpeta</span><div class="dt">'+esc(g.label)+'</div><div class="dm">'+esc(g.path)+' · '+plural(filesOfGroup[sel.id].length,"archivo","archivos")+'</div></div>';
  }else{

  cols.push(dcol("Usa a",plural(r1.length,"archivo","archivos")+(r1.some(function(x){return x.both})?" · ámbar = también lo usa":""),r1,"No depende de otros archivos"));
  if(depth>=2&&R2.length)cols.push(dcol("2 niveles adelante","lo que usan sus dependencias",R2,""));

var SVGNS="http://www.w3.org/2000/svg";
function drawWires(){
  var g=$("#wg"),svg=$("#wires"),board=$("#board");
  while(g.firstChild)g.removeChild(g.firstChild);
  var fv=$("#focusView");
  var bb=board.getBoundingClientRect();
  svg.setAttribute("width",Math.ceil(Math.max(bb.width,fv.scrollWidth+28)));
  svg.setAttribute("height",Math.ceil(Math.max(bb.height,board.scrollHeight)));
  if(!sel||!focus||sel.t==="pend"||fv.classList.contains("hide"))return;
  var c=$("#dcenter");if(!c)return;
  function rect(el){var r=el.getBoundingClientRect();return {x:r.left-bb.left,y:r.top-bb.top,w:r.width,h:r.height}}
  var C=rect(c),portR={x:C.x+C.w,y:C.y+C.h/2},portL={x:C.x,y:C.y+C.h/2};
  var list=[];
  $$('[data-col="r1"]',fv).forEach(function(el){
    var T=rect(el),both=el.classList.contains("r-both");
    list.push({a:portR,b:{x:T.x,y:T.y+T.h/2},k:both?"both":"out",n:+el.dataset.n});
  });
  $$('[data-col="l1"]',fv).forEach(function(el){
    var T=rect(el);list.push({a:{x:T.x+T.w,y:T.y+T.h/2},b:portL,k:"in",n:+el.dataset.n});
  });
  function via(col,viaCol,toRight){
    $$('[data-col="'+col+'"]',fv).forEach(function(el){
      var p=fv.querySelector('[data-col="'+viaCol+'"][data-f="'+el.dataset.via+'"]');if(!p)return;
      var T=rect(el),V=rect(p);
      if(toRight)list.push({a:{x:V.x+V.w,y:V.y+V.h/2},b:{x:T.x,y:T.y+T.h/2},k:"ind",n:1});
      else list.push({a:{x:T.x+T.w,y:T.y+T.h/2},b:{x:V.x,y:V.y+V.h/2},k:"ind",n:1});
    });
  }
  via("r2","r1",true);via("l2","l1",false);
  list.sort(function(p,q){return (p.k==="ind"?0:1)-(q.k==="ind"?0:1)});
  list.forEach(function(w){
    var dx=w.b.x-w.a.x,off=Math.max(28,Math.abs(dx)*0.5)*(dx<0?-1:1);
    var d="M"+w.a.x+" "+w.a.y+" C"+(w.a.x+off)+" "+w.a.y+","+(w.b.x-off)+" "+w.b.y+","+w.b.x+" "+w.b.y;
    var p=document.createElementNS(SVGNS,"path");
    p.setAttribute("d",d);p.setAttribute("class","w w-"+w.k);
    p.setAttribute("stroke-width",w.k==="ind"?1.3:(1.6+Math.min(2.6,Math.log2(w.n)*0.8)).toFixed(2));
    p.setAttribute("marker-end","url(#m-"+w.k+")");
    if(w.k==="both")p.setAttribute("marker-start","url(#m-both)");
    g.appendChild(p);
    if(w.n>1&&w.k!=="ind"){
      var len=p.getTotalLength(),m=p.getPointAtLength(len*(w.a===portR?0.76:0.24));
      var ci=document.createElementNS(SVGNS,"circle");ci.setAttribute("cx",m.x);ci.setAttribute("cy",m.y);ci.setAttribute("r",9);ci.setAttribute("class","wn w-"+w.k);
      var tx=document.createElementNS(SVGNS,"text");tx.setAttribute("x",m.x);tx.setAttribute("y",m.y);tx.setAttribute("class","wt");tx.textContent=w.n;
      g.appendChild(ci);g.appendChild(tx);
    }
  });
}

function bucket(list,selfF){
  var m=new Map(),same=[];
  list.forEach(function(e){
    var f=N[e[0]].f;
    if(f===selfF){same.push(e);return}
    if(!m.has(f))m.set(f,[]);m.get(f).push(e);
  });
  var arr=[];m.forEach(function(items,f){arr.push({f:f,items:items})});
  arr.sort(function(a,b){return b.items.length-a.items.length||(a.f-b.f)});
  return {same:same,files:arr};
}

function cpl(a,b){var i=0,m=Math.min(a.length,b.length);while(i<m&&a[i]===b[i])i++;return i}
function mt(q,t,wE,wS,wF){
  if(t===q.s)return wE;
  if(q.alts.has(t))return wS;
  var m=Math.min(t.length,q.s.length);
  if(m>=4&&(t.indexOf(q.s)===0||q.s.indexOf(t)===0))return wF;
  var p=cpl(t,q.s);
  if(p>=5&&p>=Math.ceil(0.6*m))return wF*0.8;

}

      e.lab.forEach(function(t){var v=mt(q,t,3,1.6,1.5);if(v>best)best=v});
      e.pth.forEach(function(t){var v=mt(q,t,1.4,.8,.7);if(v>best)best=v});
      if(best>0){hit++;tot+=best}
    });
    if(!hit)return;
    var s=tot*(hit===qs.length?1.6:1)+hit/qs.length+e.w+0.25*Math.log2(1+e.deg);

}

function matchFiles(res){
  var s=new Set();
  res.slice(0,40).forEach(function(r){

    else if(e.t==="node"||e.t==="doc"){if(N[e.id].f>=0)s.add(N[e.id].f)}
    else if(e.t==="group")filesOfGroup[e.id].slice(0,12).forEach(function(f){s.add(f)});
    else if(e.t==="pend")P[e.id].fi.forEach(function(f){s.add(f)});
  });
  Net.setMatches(s);
}

/* ---------- red: vista de grafo (canvas) ---------- */
var Net=(function(){

  var cam={x:0,y:0,k:1},camAnim=null,tw=null;
  var mode="capas",syms=false;
  var px=new Float64Array(nF),py=new Float64Array(nF);
  var fdeg=F.map(function(_,i){return fOut[i].size+fIn[i].size});

  var layerOn=L.map(function(){return true});

  var ox=new Float32Array(N.length),oy=new Float32Array(N.length);
  var LK=[],FE=[];
  var cache={},layout=null,col=null,dark=true;
  var selAct=null,hoverAct=null,hover=-1,hoverSym=-1;
  var live=null,order=[],BUNDLE=0.3,autoFit=true,legendOpen=false,edgesOn=true,pins=new Map(),matches=null,labelMode=0;
  var nSyms=N.filter(function(n){return n.f>=0&&n.k!=="file"}).length;

  function nodeR(f){return 3.2+1.5*Math.sqrt(fdeg[f])}
  function starR(f){return nodeR(f)+5+2.5*Math.sqrt(symsOf[f].length)}
  function rad(f){return syms?starR(f):nodeR(f)}

  (function prep(){
    N.forEach(function(n,i){if(n.f>=0&&n.k!=="file")symsOf[n.f].push(i)});
    symsOf.forEach(function(list,f){
      list.sort(function(a,b){return N[b].d-N[a].d||a-b});
      list.forEach(function(i,j){
        var r=nodeR(f)+4.5+2.5*Math.sqrt(j+0.5),a=j*2.399963+f*0.9;
        ox[i]=r*Math.cos(a);oy[i]=r*Math.sin(a);
      });
    });
    var und=new Map();
    F.forEach(function(_,a){
      fOut[a].forEach(function(c,b){
        FE.push({a:a,b:b,n:c});
        var k=a<b?a+"-"+b:b+"-"+a,o=und.get(k);

    order=F.map(function(_,i){return i}).sort(function(a,b){return nodeR(b)-nodeR(a)});
  })();

  /* ----- colores según el tema ----- */
  function lum(hex){
    var m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||"");
    if(!m)return 0;
    return (0.2126*parseInt(m[1],16)+0.7152*parseInt(m[2],16)+0.0722*parseInt(m[3],16))/255;
  }
  function refreshColors(){
    var cs=getComputedStyle(document.documentElement);
    function v(n){return cs.getPropertyValue(n).trim()}
    col={bg:v("--bg"),surface:v("--surface"),text:v("--text"),muted:v("--muted"),line:v("--line"),uses:v("--uses"),usedby:v("--usedby"),both:v("--both"),pend:v("--pend"),ind:v("--ind")};
    dark=lum(col.bg)<0.5;
    col.layers=dark?["#b79cff","#e3a5c8","#8fb8ea","#bccb7e","#e6a672","#7fcfbf","#a7aebb"]:["#7c5cdb","#c2578f","#3a78c2","#7a8f2a","#c4742b","#2a9d8a","#6b7482"];
    col.edge=dark?"168,184,204":"70,85,105";

  }
  function renderLegend(){
    var cnt=L.map(function(){return 0});F.forEach(function(_,f){cnt[layerOf[f]]++});

    lg.innerHTML='<button class="lgh" data-lgtoggle="1" aria-expanded="'+(legendOpen?"true":"false")+'">Capas <span>'+(legendOpen?"▾":"▸")+'</span></button>'+(legendOpen?L.map(function(l,li){
      return cnt[li]?'<button class="lgd'+(layerOn[li]?"":" off")+'" data-ly="'+li+'" title="Mostrar u ocultar esta capa"><i style="background:'+col.layers[li]+'"></i>'+esc(l.title)+'<em>'+cnt[li]+'</em></button>':"";
    }).join(""):"");
  }

  /* ----- disposición "Capas": racimos por carpeta dentro de cada capa ----- */
  function pack(items){
    var placed=[];
    items.forEach(function(it,idx){
      if(!placed.length){placed.push({id:it.id,x:0,y:0,r:it.r});return}
      var step=Math.max(1.5,it.r*0.22),found=null,a0=idx*2.399963;
      for(var rr=it.r*0.4;!found&&rr<4000;rr+=step){
        var na=Math.max(8,Math.ceil(6.2832*rr/Math.max(2.5,it.r*0.8)));
        for(var k=0;k<na;k++){
          var th=a0+k*6.2832/na,x=rr*Math.cos(th),y=rr*Math.sin(th),ok=true;
          for(var j=0;j<placed.length;j++){
            var p=placed[j],dx=p.x-x,dy=p.y-y,m=p.r+it.r;
            if(dx*dx+dy*dy<m*m){ok=false;break}
          }
          if(ok){found={x:x,y:y};break}
        }
      }
      placed.push({id:it.id,x:found.x,y:found.y,r:it.r});
    });
    var sx=0,sy=0,sw=0,R=0;
    placed.forEach(function(p){var w=p.r*p.r;sx+=p.x*w;sy+=p.y*w;sw+=w});
    var cx=sx/sw,cy=sy/sw;
    placed.forEach(function(p){p.x-=cx;p.y-=cy;R=Math.max(R,Math.sqrt(p.x*p.x+p.y*p.y)+p.r)});
    return {R:R+9,pos:placed};
  }
  var discCache={};
  function discData(){
    var key=syms?"f":"n";
    if(discCache[key])return discCache[key];
    var data=[];
    L.forEach(function(layer,li){
      var gs=[];G.forEach(function(g,gi){if(g.layer===li)gs.push(gi)});
      if(!gs.length)return;
      data.push({li:li,discs:gs.map(function(gi){
        var items=filesOfGroup[gi].map(function(f){return {id:f,r:rad(f)+2.2}});
        items.sort(function(a,b){return b.r-a.r||a.id-b.id});
        var pk=pack(items);return {gi:gi,R:pk.R,pos:pk.pos};
      })});
    });
    return (discCache[key]=data);
  }
  function arrange(data,ROWW){
    var GAP=18,BGAP=46,TOP=28;
    var out={x:new Float64Array(nF),y:new Float64Array(nF),bands:[],discs:[],yL:{},maxW:0,height:0,mode:"capas"};
    var bd=data.map(function(b){
      var rows=[],cur={d:[],w:0,h:0};
      b.discs.forEach(function(d){
        var w=2*d.R;
        if(cur.d.length&&cur.w+GAP+w>ROWW){rows.push(cur);cur={d:[],w:0,h:0}}
        cur.w+=(cur.d.length?GAP:0)+w;cur.h=Math.max(cur.h,w);cur.d.push(d);
      });
      rows.push(cur);
      return {li:b.li,rows:rows};
    });
    bd.forEach(function(b){b.rows.forEach(function(r){out.maxW=Math.max(out.maxW,r.w)})});
    var y=0;
    bd.forEach(function(b){
      var top=y,yy=y+TOP;
      b.rows.forEach(function(r){
        var xx=-r.w/2;
        r.d.forEach(function(d){
          var cx=xx+d.R,cy=yy+r.h/2;
          d.pos.forEach(function(p){out.x[p.id]=cx+p.x;out.y[p.id]=cy+p.y});
          out.discs.push({gi:d.gi,x:cx,y:cy,R:d.R});
          xx+=2*d.R+GAP;
        });
        yy+=r.h+GAP;
      });
      var bottom=yy-GAP+8;
      out.bands.push({li:b.li,top:top,bottom:bottom});
      out.yL[b.li]=(top+bottom)/2;
      y=bottom+BGAP;
    });
    out.height=y-BGAP;
    return out;
  }
  function layoutCapas(){
    var data=discData(),best=null,cw=Math.max(300,(W||900)-70),ch=Math.max(300,(H||700)-50);
    [500,650,800,1000,1250,1550,1900,2400,3200].forEach(function(rw){
      var o=arrange(data,rw),sc=Math.min(cw/(o.maxW+90),ch/(o.height+30));
      if(!best||sc>best.sc*1.02){o.sc=sc;best=o}
    });
    return best;
  }

  /* ----- disposición "Libre": fuerzas, partiendo de las capas ----- */
  function simStep(x,y,S,yT,pin){
    var vx=S.vx,vy=S.vy,rr=S.rr,i,j;
    S.alpha+=(S.target-S.alpha)*0.0228;
    var a=S.alpha,gn=G.length,cx=new Float64Array(gn),cy=new Float64Array(gn),cn=new Int32Array(gn);
    for(i=0;i<nF;i++){var g=F[i].g;cx[g]+=x[i];cy[g]+=y[i];cn[g]++}
    for(var q=0;q<LK.length;q++){
      var l=LK[q],A=l.a,B=l.b;
      var dx=x[B]+vx[B]-x[A]-vx[A],dy=y[B]+vy[B]-y[A]-vy[A],d=Math.sqrt(dx*dx+dy*dy)||1e-6;
      var k=(d-(40+rr[A]+rr[B]))/d*a/Math.min(fdeg[A],fdeg[B]),bias=fdeg[A]/(fdeg[A]+fdeg[B]);
      dx*=k;dy*=k;
      vx[B]-=dx*bias;vy[B]-=dy*bias;vx[A]+=dx*(1-bias);vy[A]+=dy*(1-bias);
    }
    for(i=0;i<nF;i++)for(j=i+1;j<nF;j++){
      var ex=x[j]-x[i],ey=y[j]-y[i],l2=ex*ex+ey*ey;
      if(l2>160000)continue;
      if(l2<1){ex=(i-j)*0.01;ey=(j-i)*0.013;l2=ex*ex+ey*ey}
      var w=150*a/l2;
      vx[i]-=ex*w;vy[i]-=ey*w;vx[j]+=ex*w;vy[j]+=ey*w;
      var m=rr[i]+rr[j];
      if(l2<m*m){var ll=Math.sqrt(l2),push=(m-ll)/ll*0.35;ex*=push;ey*=push;vx[i]-=ex;vy[i]-=ey;vx[j]+=ex;vy[j]+=ey}
    }
    for(i=0;i<nF;i++){
      var g2=F[i].g;
      vx[i]+=(cx[g2]/cn[g2]-x[i])*0.11*a;
      vy[i]+=(cy[g2]/cn[g2]-y[i])*0.11*a+(yT[layerOf[i]]-y[i])*0.075*a;
    }
    var mx=0,my=0;
    for(i=0;i<nF;i++){vx[i]*=0.6;vy[i]*=0.6;x[i]+=vx[i];y[i]+=vy[i];mx+=x[i];my+=y[i]}
    mx/=nF;my/=nF;
    for(i=0;i<nF;i++){x[i]-=mx;y[i]-=my}
    if(pin)pin.forEach(function(v,id){x[id]=v.x;y[id]=v.y;vx[id]=0;vy[id]=0});
  }
  function newSim(a0,target){
    var rr=[];for(var i=0;i<nF;i++)rr[i]=(syms?rad(i)*0.8:rad(i))+2;
    return {vx:new Float64Array(nF),vy:new Float64Array(nF),rr:rr,alpha:a0,target:target||0};
  }
  function layoutLibre(){
    var cap=getLayout("capas");
    var x=Float64Array.from(cap.x),y=Float64Array.from(cap.y);
    for(var i=0;i<nF;i++){x[i]+=((i*37)%11-5)*0.8;y[i]+=((i*53)%13-6)*0.8}
    var S=newSim(1,0);
    for(var t=0;t<340;t++)simStep(x,y,S,cap.yL,null);
    return {x:x,y:y,bands:[],discs:[],yL:cap.yL,maxW:cap.maxW,height:cap.height,mode:"libre"};
  }
  function getLayout(m){
    var key=m+(syms?"+f":"");
    if(!cache[key])cache[key]=m==="capas"?layoutCapas():layoutLibre();
    return cache[key];
  }

  /* ----- cámara ----- */
  function bounds(set){
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,any=false,X=tw?tw.tx:px,Y=tw?tw.ty:py;
    function add(f){var r=rad(f)+6;any=true;x0=Math.min(x0,X[f]-r);x1=Math.max(x1,X[f]+r);y0=Math.min(y0,Y[f]-r);y1=Math.max(y1,Y[f]+r)}
    if(set)set.forEach(add);else for(var f=0;f<nF;f++)if(layerOn[layerOf[f]])add(f);
    return any?{x0:x0,y0:y0,x1:x1,y1:y1}:null;
  }
  function insetBottom(){return (window.innerWidth<=880&&document.body.classList.contains("sheet"))?Math.min(H*0.55,window.innerHeight*0.48):0}
  function fitBox(b,pad,maxK,animate){
    if(!b||!W)return;
    var h=H-insetBottom();
    var k=Math.min((W-2*pad)/Math.max(1,b.x1-b.x0),(h-2*pad)/Math.max(1,b.y1-b.y0),maxK);
    k=Math.max(0.05,Math.min(k,6));
    var to={k:k,x:W/2-(b.x0+b.x1)/2*k,y:h/2-(b.y0+b.y1)/2*k};
    if(animate){camAnim={t0:performance.now(),dur:420,from:{x:cam.x,y:cam.y,k:cam.k},to:to}}
    else{cam.x=to.x;cam.y=to.y;cam.k=to.k;camAnim=null}
    kick();
  }
  function fitAll(animate){fitBox(bounds(null),28,1.4,animate)}
  function fitSelection(){
    if(!selAct){autoFit=true;fitAll(true);return}
    autoFit=false;
    var s=new Set();
    selAct.sel.forEach(function(f){s.add(f)});selAct.rel.forEach(function(r,f){s.add(f)});
    if(depth>=2)selAct.ind.forEach(function(r,f){s.add(f)});
    fitBox(bounds(s),70,2.2,true);
  }
  function zoomAt(lx,ly,f){
    var k=Math.max(0.05,Math.min(8,cam.k*f)),r=k/cam.k;
    cam.x=lx-(lx-cam.x)*r;cam.y=ly-(ly-cam.y)*r;cam.k=k;camAnim=null;autoFit=false;kick();
  }

  /* ----- tamaño, bucle y animaciones ----- */
  function resize(){
    var r=box.getBoundingClientRect();
    if(r.width<20||r.height<20)return;
    var nd=Math.min(2.5,window.devicePixelRatio||1),first=!sized;
    if(!first&&Math.abs(r.width-W)<0.5&&Math.abs(r.height-H)<0.5&&nd===dpr){kick();return}
    sized=true;dpr=nd;W=r.width;H=r.height;
    cvs.width=Math.round(W*dpr);cvs.height=Math.round(H*dpr);
    cvs.style.width=W+"px";cvs.style.height=H+"px";
    if(ready&&autoFit){fitAll(false)}
    kick(first);
  }
  function kick(){if(!raf)raf=requestAnimationFrame(loop)}
  function ease(s){return s<.5?2*s*s:1-Math.pow(-2*s+2,2)/2}
  function loop(now){
    raf=0;var more=false;
    if(tw){
      var s=Math.min(1,(now-tw.t0)/tw.dur),e=ease(s);
      for(var i=0;i<nF;i++){px[i]=tw.fx[i]+(tw.tx[i]-tw.fx[i])*e;py[i]=tw.fy[i]+(tw.ty[i]-tw.fy[i])*e}
      if(s>=1)tw=null;else more=true;
    }
    if(camAnim){
      var u=Math.min(1,(now-camAnim.t0)/camAnim.dur),eu=ease(u),a=camAnim.from,b=camAnim.to;
      cam.x=a.x+(b.x-a.x)*eu;cam.y=a.y+(b.y-a.y)*eu;cam.k=a.k+(b.k-a.k)*eu;
      if(u>=1)camAnim=null;else more=true;
    }
    if(live){
      for(var n=0;n<2;n++)simStep(px,py,live.S,live.yT,pins);
      if(live.S.alpha<0.004&&!live.hold){live=null}else more=true;
    }

    if(more)kick();
  }
  function moveTo(L2,animate){
    if(animate&&ready){
      tw={t0:performance.now(),dur:650,fx:Float64Array.from(px),fy:Float64Array.from(py),tx:L2.x,ty:L2.y};
    }else{px.set(L2.x);py.set(L2.y);tw=null}
    layout=L2;live=null;pins.clear();kick();
  }

  /* ----- relaciones para resaltar ----- */
  function relFile(f){
    var rel=new Map();
    fOut[f].forEach(function(c,g){rel.set(g,{out:c,inn:0})});
    fIn[f].forEach(function(c,g){var r=rel.get(g);if(r)r.inn=c;else rel.set(g,{out:0,inn:c})});
    return {sel:new Set([f]),rel:rel,ind:new Map(),edges:null};
  }
  function buildEdges(A){
    var m=new Map(),list=[];
    function add(a,b,n){
      var key=a<b?a+"-"+b:b+"-"+a,o=m.get(key);
      if(!o){o={a:a<b?a:b,b:a<b?b:a,ab:0,ba:0};m.set(key,o)}
      if(a===o.a)o.ab+=n;else o.ba+=n;
    }
    if(A.nodeMode){
      var s=A.sel.values().next().value;
      if(s!=null)A.rel.forEach(function(r,f){if(r.out)add(s,f,r.out);if(r.inn)add(f,s,r.inn)});
    }else{
      A.sel.forEach(function(s){

    m.forEach(function(o){
      var aSel=A.sel.has(o.a),s=aSel?o.a:o.b,t=aSel?o.b:o.a;
      var su=aSel?o.ab:o.ba,tu=aSel?o.ba:o.ab;
      list.push({s:s,o:t,k:su&&tu?"both":(su?"out":"in"),n:su+tu});
    });
    if(A.ind&&A.ind.size){
      A.rel.forEach(function(r,f){
        fOut[f].forEach(function(c,g){if(A.ind.has(g))list.push({s:f,o:g,k:"ind",n:c,dir:"out"})});
        fIn[f].forEach(function(c,g){if(A.ind.has(g))list.push({s:f,o:g,k:"ind",n:c,dir:"in"})});

  }
  function setMatches(s){matches=s&&s.size?s:null;kick()}

  }

  /* ----- dibujo ----- */
  function w2sx(x){return x*cam.k+cam.x}
  function w2sy(y){return y*cam.k+cam.y}
  var gcx=new Float64Array(G.length),gcy=new Float64Array(G.length);
  function updateCenters(){

    }
  }
  function routeOf(a,b,bend){

    btns[cursor].scrollIntoView({block:"nearest"});
  }else if(ev.key==="Enter"){
    var b=btns[Math.max(cursor,0)];if(b){pick(b.dataset.rt,b.dataset.rid);q.blur()}
  }else if(ev.key==="Escape"){$("#results").classList.remove("on");Net.setMatches(null);q.blur()}
});
document.addEventListener("click",function(ev){
  var t=ev.target;
  if(!t.closest(".search"))$("#results").classList.remove("on");
  var b=t.closest("[data-rt]");if(b){pick(b.dataset.rt,b.dataset.rid);return}
  b=t.closest("[data-view]");if(b){setView(b.dataset.view);return}
  b=t.closest("[data-layout]");if(b){Net.setMode(b.dataset.layout);return}
  b=t.closest("#symBtn");if(b){Net.toggleSyms();return}
  b=t.closest("#edgeBtn");if(b){Net.toggleEdges();return}
  b=t.closest("#lblBtn");if(b){Net.cycleLabels();return}
  b=t.closest("[data-lgtoggle]");if(b){Net.toggleLegend();return}
  b=t.closest("[data-ly]");if(b){Net.toggleLayer(+b.dataset.ly);return}
  b=t.closest("[data-zoom]");if(b){Net.zoom(b.dataset.zoom);return}
  b=t.closest("[data-search]");if(b){q.value=b.dataset.search;showResults(q.value);var f=search(q.value)[0];if(f&&b.closest("#panel")){pick(f.e.t,f.e.id)}return}
  b=t.closest(".tile");if(b){choose({t:"file",id:+b.dataset.f});return}
  b=t.closest(".group-head");if(b){choose({t:"group",id:+b.dataset.g});return}
  b=t.closest("[data-node]");if(b){choose({t:"node",id:+b.dataset.node});return}
  b=t.closest("[data-file]");if(b&&b.closest("#panel")){choose({t:"file",id:+b.dataset.file});return}
  b=t.closest("[data-pend]");if(b){tab="resumen";choose({t:"pend",id:+b.dataset.pend});return}
  b=t.closest("[data-pendtab]");if(b){tab="pend";pfilter="all";render();return}
  b=t.closest("[data-more]");if(b){expandAll=true;render();return}
  b=t.closest("[data-pf]");if(b){pfilter=b.dataset.pf;renderPanel();return}
  b=t.closest("[data-tab]");if(b){tab=b.dataset.tab;if(tab==="resumen"&&!sel){}render();return}
  b=t.closest("[data-focus]");if(b){focus=b.dataset.focus==="1";render();return}
  b=t.closest("[data-depth]");if(b){depth=+b.dataset.depth;render();return}
});
function setView(v){
  view=v;try{localStorage.setItem("valu-map-view",v)}catch(e){}
  render();
  if(v==="red"&&sel)Net.fitSelection();
}
$("#clearBtn").addEventListener("click",function(){sel=null;tab="resumen";render();if(view==="red")Net.zoom("fit")});
$("#closeSheet").addEventListener("click",function(){document.body.classList.remove("sheet")});
$("#copyBtn").addEventListener("click",function(){
  var btn=this,txt=lastText||"";
  function done(m){btn.textContent=m;setTimeout(function(){btn.textContent="Copiar"},1400)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){done("Copiado")},function(){done("No se pudo")})}
  else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done("Copiado")}catch(e){done("No se pudo")}document.body.removeChild(ta)}
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="/"&&document.activeElement!==q){ev.preventDefault();q.focus()}
  if(ev.key==="Escape"&&document.activeElement!==q&&sel){sel=null;render()}
});
var rt=null;
window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(drawWires,120)});
var themeBtn=$("#themeBtn"),root=document.documentElement;
try{var saved=localStorage.getItem("valu-map-theme");if(saved)root.setAttribute("data-theme",saved)}catch(e){}
themeBtn.addEventListener("click",function(){
  var cur=root.getAttribute("data-theme");
  var dark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
  var nxt=dark?"light":"dark";root.setAttribute("data-theme",nxt);
  try{localStorage.setItem("valu-map-theme",nxt)}catch(e){}
  Net.refreshColors();
});
if(window.matchMedia){try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){Net.refreshColors()})}catch(e){}}
$("#hmeta").textContent=D.meta.files+" archivos · "+D.meta.nodes+" elementos · "+D.meta.edges+" conexiones"+(D.meta.commit?" · grafo @"+D.meta.commit:"");
render();
})();
</script>
</body>
</html>
